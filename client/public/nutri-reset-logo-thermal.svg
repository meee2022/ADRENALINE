<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
  <title id="title">Nutri Reset</title>
  <desc id="desc">High contrast monochrome Nutri Reset wordmark for thermal labels</desc>
  <g fill="#000">
    <text x="320" y="78" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="17">NUTRI</text>
    <text x="320" y="158" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="9">RESET</text>
  </g>
</svg>
