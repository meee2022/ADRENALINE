: swap;\n  src: url(\"1a23ec64-8872-430d-abb5-72825dcebe5f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* arabic */\n@font-face {\n  font-family: 'Tajawal';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"50f803ab-f2af-4229-bb65-0a10a487965d\") format('woff2');\n  unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC, U+102E0-102FB, U+10E60-10E7E, U+10EC2-10EC4, U+10EFC-10EFF, U+1EE00-1EE03, U+1EE05-1EE1F, U+1EE21-1EE22, U+1EE24, U+1EE27, U+1EE29-1EE32, U+1EE34-1EE37, U+1EE39, U+1EE3B, U+1EE42, U+1EE47, U+1EE49, U+1EE4B, U+1EE4D-1EE4F, U+1EE51-1EE52, U+1EE54, U+1EE57, U+1EE59, U+1EE5B, U+1EE5D, U+1EE5F, U+1EE61-1EE62, U+1EE64, U+1EE67-1EE6A, U+1EE6C-1EE72, U+1EE74-1EE77, U+1EE79-1EE7C, U+1EE7E, U+1EE80-1EE89, U+1EE8B-1EE9B, U+1EEA1-1EEA3, U+1EEA5-1EEA9, U+1EEAB-1EEBB, U+1EEF0-1EEF1;\n}\n/* latin */\n@font-face {\n  font-family: 'Tajawal';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"13d1c831-4c1d-4a9f-928a-35cc0b3def0d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  deck-stage:not(:defined){visibility:hidden}\n\n  :root{\n    --type-scale: 1;\n    --type-display: calc(118px * var(--type-scale));\n    --type-title:   calc(66px  * var(--type-scale));\n    --type-subtitle:calc(40px  * var(--type-scale));\n    --type-lead:    calc(32px  * var(--type-scale));\n    --type-body:    calc(28px  * var(--type-scale));\n    --type-small:   calc(25px  * var(--type-scale));\n    --type-eyebrow: calc(24px  * var(--type-scale));\n\n    --pad-x: 130px;\n    --pad-y: 96px;\n    --gap: 34px;\n\n    --font-display: 'Tajawal';\n    --font-body: 'IBM Plex Sans Arabic';\n\n    --r: 22px;\n\n    /* official ADRENALINE brand cyan (sampled from logo) — kept exact in both themes */\n    --brand:#3AC7F4;\n  }\n\n  /* ---------- THEMES (the two directions) ---------- */\n  html[data-theme=\"light\"]{\n    --bg:#FFFFFF; --bg-2:#EAF3FB; --surface:#FFFFFF; --surface-2:#F2F8FC;\n    --ink:#0E2A4A; --ink-2:#2D4A67; --muted:#6A7E91; --line:#D9E6F1;\n    --accent:#0E76AC; --accent-2:#3AC7F4; --on-accent:#FFFFFF;\n    --shadow: 0 24px 60px -28px rgba(14,42,74,.22);\n    --card-bg: linear-gradient(158deg, #FFFFFF 0%, #ECF5FC 100%);\n    --card-line: #DCE9F4;\n    --card-hi: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.35);\n    --shadow-3d: 0 1px 2px rgba(14,42,74,.05), 0 10px 22px -10px rgba(14,42,74,.16), 0 34px 64px -26px rgba(14,42,74,.30);\n    --shadow-3d-hi: 0 4px 8px rgba(14,42,74,.07), 0 18px 34px -12px rgba(14,42,74,.22), 0 50px 90px -30px rgba(14,42,74,.38);\n    --scrim: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 70%, var(--bg) 100%);\n  }\n  html[data-theme=\"dark\"]{\n    --bg:#0E2A4A; --bg-2:#0B2440; --surface:#143655; --surface-2:#102E4D;\n    --ink:#F2F8FC; --ink-2:#C9DBEB; --muted:#90A8BE; --line:#274F70;\n    --accent:#3AC7F4; --accent-2:#3AC7F4; --on-accent:#06233A;\n    --shadow: 0 28px 70px -30px rgba(0,0,0,.55);\n    --card-bg: linear-gradient(158deg, #1A4063 0%, #0F2C4A 100%);\n    --card-line: #2C597C;\n    --card-hi: inset 0 1px 0 rgba(255,255,255,.10);\n    --shadow-3d: 0 2px 6px rgba(0,0,0,.30), 0 14px 30px -12px rgba(0,0,0,.50), 0 42px 74px -30px rgba(0,0,0,.62);\n    --shadow-3d-hi: 0 4px 10px rgba(0,0,0,.36), 0 22px 42px -14px rgba(0,0,0,.58), 0 58px 100px -34px rgba(0,0,0,.7);\n    --scrim: linear-gradient(90deg, rgba(14,42,74,0) 0%, rgba(14,42,74,.55) 70%, var(--bg) 100%);\n  }\n\n  *{box-sizing:border-box;}\n  body{margin:0;background:#000;}\n  deck-stage{ background:var(--bg); }\n\n  .slide{\n    box-sizing:border-box;\n    padding: var(--pad-y) var(--pad-x);\n    background: var(--bg);\n    color: var(--ink);\n    font-family: var(--font-body), system-ui, sans-serif;\n    display:flex;\n    flex-direction:column;\n    overflow:hidden;\n    direction:rtl;\n    text-align:right;\n  }\n  .slide.bg-2{ background: var(--bg-2); }\n\n  /* subtle branded backdrop for the plain white content slides */\n  .slide{ position:relative; }\n  .slide.deco::before{\n    content:\"\"; position:absolute; pointer-events:none; z-index:0;\n    width:820px; height:820px; right:-260px; top:-300px; border-radius:50%;\n    background: radial-gradient(circle at center, color-mix(in srgb, var(--brand) 12%, transparent) 0%, transparent 60%);\n  }\n  .slide.deco::after{\n    content:\"\"; position:absolute; pointer-events:none; z-index:0;\n    width:560px; height:560px; left:-150px; bottom:-170px;\n    background:url(\"052fada9-1d8f-4f04-a2c1-2e329c5e15d1\") no-repeat center / contain;\n    opacity:.045;\n  }\n  html[data-theme=\"dark\"] .slide.deco::after{ opacity:.07; }\n  .slide.deco > *{ position:relative; z-index:1; }\n\n  /* ---------- per-slide brand frame (subtle 3D border) ---------- */\n  .slide-frame{\n    position:absolute; inset:32px; border-radius:26px; pointer-events:none; z-index:40;\n    border:2px solid color-mix(in srgb, var(--brand) 42%, transparent);\n    box-shadow:\n      inset 0 2px 5px rgba(255,255,255,.20),\n      inset 0 -12px 30px -18px rgba(14,42,74,.20),\n      0 16px 40px -28px rgba(14,42,74,.55);\n  }\n  html[data-theme=\"dark\"] .slide-frame{\n    border-color: color-mix(in srgb, var(--brand) 52%, transparent);\n    box-shadow:\n      inset 0 2px 5px rgba(255,255,255,.07),\n      inset 0 -12px 30px -18px rgba(0,0,0,.45),\n      0 16px 40px -26px rgba(0,0,0,.7);\n  }\n\n  /* ---------- 3D card treatment (applies across the deck) ---------- */\n  html[data-theme] .vm-card,\n  html[data-theme] .val-c غذية — في قطر.<\u002Fp>\n      <div class=\"cover-foot\">\n        <span>س.ت ‏195910/01<\u002Fspan><span class=\"dot\"><\u002Fspan>\n        <span>المرخية، الدوحة، قطر<\u002Fspan><span class=\"dot\"><\u002Fspan>\n        <span>2026<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"col-img\">\n      <img src=\"756a8003-9bd2-4a8b-b17d-7ac80f785fe2\" alt=\"فرع أدرينالين - المرخية\">\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 CONTENTS -->\n  <section class=\"slide toc-slide deco\" data-label=\"المحتويات\">\n    <div class=\"toc-head\">\n      <div>\n        <p class=\"tk\">الملف التعريفي<\u002Fp>\n        <h2>المحتويات<\u002Fh2>\n        <p class=\"tsub\">دليلٌ سريع لأقسام ملف أدرينالين التعريفي.<\u002Fp>\n      <\u002Fdiv>\n      <img class=\"ah\" src=\"052fada9-1d8f-4f04-a2c1-2e329c5e15d1\" alt=\"\">\n    <\u002Fdiv>\n    <div class=\"toc-grid\">\n      <div class=\"toc-item\"><span class=\"toc-num\">01<\u002Fspan><span class=\"toc-label\">عن أدرينالين<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">02<\u002Fspan><span class=\"toc-label\">قصتنا<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">03<\u002Fspan><span class=\"toc-label\">الرؤية والرسالة<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">04<\u002Fspan><span class=\"toc-label\">قيمنا<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">05<\u002Fspan><span class=\"toc-label\">فلسفتنا الغذائية<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">06<\u002Fspan><span class=\"toc-label\">ماذا نقدّم<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">07<\u002Fspan><span class=\"toc-label\">من قائمتنا<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">08<\u002Fspan><span class=\"toc-label\">برامج الوجبات والاشتراكات<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">09<\u002Fspan><span class=\"toc-label\">من مطبخنا إليك<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">10<\u002Fspan><span class=\"toc-label\">مواقعنا<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">11<\u002Fspan><span class=\"toc-label\">لماذا أدرينالين<\u002Fspan><\u002Fdiv>\n      <div class=\"toc-item\"><span class=\"toc-num\">12<\u002Fspan><span class=\"toc-label\">تواصل معنا<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 ABOUT -->\n  <section class=\"slide deco\" data-label=\"عن أدرينالين\">\n    <div class=\"split\">\n      <div class=\"stack\">\n        <p class=\"eyebrow\">من نحن<\u002Fp>\n        <h2 class=\"stitle\">عن أدرينالين<\u002Fh2>\n        <p class=\"lead\">أدرينالين علامة قطرية متخصّصة في الأكل الصحي، نقدّم وجباتٍ طازجة ومتوازنة تُحضَّر يوميًا بإشراف اختصاصيي تغذية. نجعل الخيار الصحي سهلًا ولذيذًا — في الفرع أو عبر التوصيل في جميع أنحاء قطر.<\u002Fp>\n        <div class=\"diet\">\n          <img class=\"hicon\" src=\"6dbcbd32-55ee-49a2-a00d-890ae5fa481e\" alt=\"\">\n          <div>\n            <div class=\"lbl\">صُنع في قطر<\u002Fdiv>\n            <div class=\"num\" style=\"font-size:34px; direction:rtl;\">بمعايير غذائية عالية<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"about-feats\">\n        <div class=\"afeat\">\n          <div class=\"ic-wrap\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-4.5-7-10a7 7 0 0 1 14 0c0 5.5-7 10-7 10z\"><\u002Fpath><circle cx=\"12\" cy=\"11\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <h4>علامة قطرية<\u002Fh4>\n          <p>مفهومٌ قطري وُلد محليًا ليقدّم تجربة أكل صحي تناسب ذوق المنطقة.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"afeat\">\n          <div class=\"ic-wrap\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3h6v3a3 3 0 0 1-3 3 3 3 0 0 1-3-3z\"><\u002Fpath><path d=\"M12 9v6\"><\u002Fpath><path d=\"M8 21h8l-1-4H9z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h4>إشراف تغذوي<\u002Fh4>\n          <p>قوائمنا يصمّمها اختصاصيو تغذية بسعراتٍ ونِسبٍ غذائية محسوبة.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"afeat\">\n          <div class=\"ic-wrap\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h4>تحضير يومي<\u002Fh4>\n          <p>وجباتٌ طازجة تُحضَّر كل يوم في مطبخنا، بلا حفظٍ طويل.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"afeat\">\n          <div class=\"ic-wrap\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7h11v8H3z\"><\u002Fpath><path d=\"M14 10h4l3 3v2h-7z\"><\u002Fpath><circle cx=\"7\" cy=\"17\" r=\"1.8\"><\u002Fcircle><circle cx=\"17.5\" cy=\"17\" r=\"1.8\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <h4>توصيل في كل قطر<\u002Fh4>\n          <p>نوصل الخيار الصحي إلى باب عملائنا في جميع أنحاء قطر.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 STORY -->\n  <section class=\"slide bg-2\" data-label=\"قصتنا\">\n    <div class=\"split narrow-img\">\n      <div class=\"stack\">\n        <p class=\"eyebrow\">رحلتنا<\u002Fp>\n        <h2 class=\"stitle\">قصتنا<\u002Fh2>\n        <p class=\"lead\">بدأت أدرينالين من قناعةٍ بسيطة: أنّ الطعام الصحي يجب أن يكون متاحًا، لذيذًا، وملائمًا لإيقاع الحياة اليومي. من هذه الفكرة وُلِد مطبخٌ يحضّر وجباتٍ متوازنة طازجة، وثلاجةٌ جاهزة تتيح للعميل أن يختار وجبته الصحية في ثوانٍ.<\u002Fp>\n        <p class=\"lead\" style=\"font-family:var(--font-display); font-weight:800; color:var(--accent); font-size:46px; max-width:none;\">نجعل الخي 02Fp>\n      <h2 class=\"stitle\">مواقعنا<\u002Fh2>\n      <div class=\"loc-list\">\n        <div class=\"loc-card primary\">\n          <div class=\"lc-top\">\n            <span class=\"lc-badge\">الإنتاج والتوزيع<\u002Fspan>\n            <h4>المطبخ الرئيسي — الثمامة<\u002Fh4>\n          <\u002Fdiv>\n          <p>المطبخ المركزي الذي تُحضَّر فيه الوجبات يوميًا وتُوزَّع منه على الفرع وخدمات التوصيل في جميع أنحاء قطر.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"loc-card\">\n          <div class=\"lc-top\">\n            <span class=\"lc-badge\">بيع وأخذ مباشر<\u002Fspan>\n            <h4>فرع المرخية — الدوحة<\u002Fh4>\n          <\u002Fdiv>\n          <p>نقطة البيع والأخذ المباشر، حيث تختار وجبتك الصحية من ثلاجة العرض في ثوانٍ.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"loc-card\">\n          <div class=\"lc-top\">\n            <span class=\"lc-badge\">بيع وأخذ مباشر<\u002Fspan>\n            <h4>فرع لوسيل — لوسيل<\u002Fh4>\n          <\u002Fdiv>\n          <p>فرعنا في مدينة لوسيل، يقدّم التجربة نفسها من الاختيار المباشر للوجبات الصحية الطازجة.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"loc-foot\">\n        <span>س.ت <span class=\"v ltr\">195910/01<\u002Fspan><\u002Fspan><span class=\"dot\"><\u002Fspan>\n        <span>متوفّرون عبر تطبيقات التوصيل<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 13 WHY US -->\n  <section class=\"slide bg-2\" data-label=\"لماذا أدرينالين\">\n    <div class=\"head-block\">\n      <p class=\"eyebrow\">نقاط تميّزنا<\u002Fp>\n      <h2 class=\"stitle\">لماذا أدرينالين<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"why-grid\">\n      <div class=\"why\">\n        <span class=\"wn\">01<\u002Fspan>\n        <div><h4>إشراف تغذوي<\u002Fh4><p>وجباتٌ يصمّمها اختصاصيو التغذية بسعراتٍ محسوبة.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <span class=\"wn\">02<\u002Fspan>\n        <div><h4>تحضيرٌ يومي<\u002Fh4><p>تحضيرٌ طازج كل يوم، من المطبخ إلى الثلاجة مباشرة.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <span class=\"wn\">03<\u002Fspan>\n        <div><h4>تنوّعٌ واسع<\u002Fh4><p>قوائم تناسب كل ذوقٍ وهدف — من الفطور إلى الحلويات.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <span class=\"wn\">04<\u002Fspan>\n        <div><h4>توصيلٌ في كل قطر<\u002Fh4><p>متوفّر عبر أبرز تطبيقات التوصيل في الدولة.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14 CONTACT -->\n  <section class=\"slide deco\" data-label=\"تواصل معنا\">\n    <div class=\"head-block\">\n      <p class=\"eyebrow\">تواصل معنا<\u002Fp>\n      <h2 class=\"stitle\">لنبقَ على تواصل<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"contact-grid\">\n      <div class=\"c-rows\">\n        <div class=\"c-row\">\n          <span class=\"k\">للتواصل واستشارة اختصاصي التغذية<\u002Fspan>\n          <span class=\"v ltr\">+974 5114 4366<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"c-row\">\n          <span class=\"k\">الموقع<\u002Fspan>\n          <span class=\"v\">المرخية، الدوحة، قطر<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"c-row\">\n          <span class=\"k\">متوفرون عبر تطبيقات التوصيل<\u002Fspan>\n          <div class=\"deliv\">\n            <div class=\"app\"><img src=\"a273ec58-17f2-472b-844a-21ebb59c6f0a\" alt=\"Talabat\"><span>Talabat<\u002Fspan><\u002Fdiv>\n            <div class=\"app\"><img src=\"2252ccd4-2a49-4907-9fe6-7489215b9a3f\" alt=\"Snoonu\"><span>Snoonu<\u002Fspan><\u002Fdiv>\n            <div class=\"app\"><img src=\"e429e5a3-4e51-413c-8922-e267185d5261\" alt=\"Deliveroo\"><span>Deliveroo<\u002Fspan><\u002Fdiv>\n            <div class=\"app\"><img src=\"f54f5581-9625-4402-987d-b238b3551869\" alt=\"Keeta\"><span>Keeta<\u002Fspan><\u002Fdiv>\n            <div class=\"app\"><img src=\"e83755b1-66fc-44a2-a546-75c6ea0b124a\" alt=\"Rafeeq\"><span>Rafeeq<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"contact-foot\">\n          <img data-logo=\"\" data-light=\"assets/logo-no-bg.png\" data-dark=\"assets/logo-dark.png\" src=\"e895bb57-9951-4e00-ac8b-16b16c946928\" alt=\"ADRENALINE\">\n          <span class=\"tg\">الأكل الصحي .. خيارٌ يومي<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"qr-card\">\n        <img src=\"1edde3a6-d75d-4f1e-b22d-9ac4ae3da4e5\" alt=\"إنستغرام\">\n        <span class=\"qr-l\">تابعنا على إنستغرام<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<!-- Tweaks -->\n<div id=\"tweaks-root\"><\u002Fdiv>\n\n<script src=\"f64a2374-c927-499e-821c-b9f581ac5de4\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"df280094-0440-4299-a88b-ed59f98ecd0b\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"72e1fdbe-6050-48b0-8b16-34e6aef681e4\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\u002Fscript>\n<script type=\"text/babel\" src=\"986001d7-f57e-47e0-988f-a5a5143a32ad\"><\u002Fscript>\n<script type=\"text/babel\">\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"theme\": \"light\",\n  \"accent\": \"#0E76AC\",\n  \"headingFont\": \"Tajawal\",\n  \"textScale\": 1\n}/*EDITMODE-END*/;\n\nfunction App(){\n  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);\n\n  React.useEffect(()=>{\n    const root = document.documentElement;\n    root.setAttribute('data-theme', t.theme);\n    root.style.setProperty('--type-scale', t.textScale);\n    // Only override accent when the user picks a custom one — otherwise let the\n    // per-theme stylesheet value win (light navy-blue #0E76AC / dark cyan #3AC7F4).\n    if (t.accent && t.accent !== TWEAK_DEFAULTS.accent) root.style.setProperty('--accent', t.accent);\n    else root.style.removeProperty('--accent');\n    root.style.setProperty('--font-display', \"'\"+t.headingFont+\"'\");\n    document.querySelectorAll('img[data-logo]').forEach(img=>{\n      let src = t.theme==='dark' ? img.dataset.dark : img.dataset.light;\n      if(window.__resources){\n        const map = {\n          'assets/logo-no-bg.png': window.__resources['logo-light'],\n          'assets/logo-dark.png': window.__resources['logo-dark'],\n          'assets/heart-logo.png': window.__resources['heart-logo']\n        };\n        if(map[src]) src = map[src];\n      }\n      if(src) img.src = src;\n    });\n  }, [t.theme, t.accent, t.headingFont, t.textScale]);\n\n  return (\n    <TweaksPanel title=\"Tweaks\">\n      <TweakSection label=\"الاتجاه — Direction\" />\n      <TweakRadio label=\"الثيم\" value={t.theme}\n        options={[{value:'light',label:'أبيض'},{value:'dark',label:'أزرق غامق'}]}\n        onChange={(v)=>setTweak('theme', v)} />\n      <TweakColor label=\"اللون المميّز\" value={t.accent}\n        options={['#0E76AC','#3AC7F4','#0E2A4A','#1488C7']}\n        onChange={(v)=>setTweak('accent', v)} />\n      <TweakSection label=\"الخط والحجم — Type\" />\n      <TweakSelect label=\"خط العناوين\" value={t.headingFont}\n        options={['Tajawal','Cairo','Almarai']}\n        onChange={(v)=>setTweak('headingFont', v)} />\n      <TweakSlider label=\"حجم النص\" value={t.textScale} min={0.85} max={1.15} step={0.05}\n        onChange={(v)=>setTweak('textScale', v)} />\n    <\u002FTweaksPanel>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('tweaks-root')).render(<App/>);\n<\u002Fscript>\n\n<script src=\"3f957e1a-f012-489f-87da-85cd8d7bb92c\"><\u002Fscript>\n<script>\n  /* inject a brand identity frame into every slide */\n  (function(){\n    function addFrames(){\n      document.querySelectorAll('deck-stage > section').forEach(function(s){\n        if(s.querySelector(':scope > .slide-frame')) return;\n        var f = document.createElement('div');\n        f.className = 'slide-frame';\n        f.setAttribute('aria-hidden','true');\n        s.appendChild(f);\n      });\n    }\n    if(document.readyState !== 'loading') addFrames();\n    else document.addEventListener('DOMContentLoaded', addFrames);\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
