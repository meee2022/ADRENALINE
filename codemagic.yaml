# بناء iOS ورفعه إلى TestFlight من السحابة — لا يحتاج ماك.
# الدليل: دليل/نشر-التطبيق-على-آب-ستور.md
#
# ما يلزم ضبطه في Codemagic (مرة واحدة):
#   1. Teams → Integrations → App Store Connect: مفتاح API (Issuer ID + Key ID + ملف .p8)
#      باسم "adrenaline-asc".
#   2. Environment variables → مجموعة "adrenaline-ios":
#        VITE_CONVEX_URL = https://laudable-mongoose-958.convex.cloud   (الإنتاج)
#        APP_STORE_APPLE_ID = 6808112595   (App Store Connect → App Information → Apple ID)
#   3. في App Store Connect: أنشئ التطبيق أولاً بالمعرّف com.adrenalinehealthy.app.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: adrenaline-asc
    environment:
      groups:
        - adrenaline-ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.adrenalinehealthy.app
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
      cancel_previous_builds: true
    scripts:
      - name: تثبيت الاعتماديات
        script: npm ci
      - name: بيئة الإصدار (قاعدة الإنتاج)
        script: |
          set -e
          test -n "$VITE_CONVEX_URL" || { echo "VITE_CONVEX_URL غير مضبوط في مجموعة adrenaline-ios"; exit 1; }
          printf 'VITE_CONVEX_URL=%s\nIOS_RELEASE_CONFIRMED=true\n' "$VITE_CONVEX_URL" > client/.env.ios.local
      - name: بناء الواجهة ومزامنة Capacitor (النسخة الكاملة — لا قشرة)
        script: npm run build:ios
      - name: رقم البناء التالي من App Store Connect
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((LATEST + 1))
          echo "build number: $NEXT"
          cd ios/App && agvtool new-version -all "$NEXT"
      - name: ملفات التوقيع
        script: xcode-project use-profiles
      - name: بناء IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # المراجعة النهائية للمتجر تُرسل يدوياً من App Store Connect بعد تجربة TestFlight
        submit_to_app_store: false

  # ─────────────────────────────────────────────────────────────────────────
  # تطبيق Expo الجديد (apps/mobile) — نفس مفتاح App Store Connect ونفس التوقيع
  # ونفس المعرّف com.adrenalinehealthy.app، فيحلّ محلّ قشرة Capacitor على TestFlight.
  # يبدأ من لوحة Codemagic (Start new build → iOS (Expo) → TestFlight) أو بوسم expo-ios-v*.
  # الدليل: دليل/نشر-التطبيق-TestFlight.md
  ios-expo-testflight:
    name: iOS (Expo) → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: adrenaline-asc
    environment:
      groups:
        - adrenaline-ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.adrenalinehealthy.app
      node: 24
      xcode: latest
      cocoapods: default
      vars:
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "expo-ios-v*"
      cancel_previous_builds: true
    scripts:
      - name: تثبيت اعتماديات التطبيق
        script: |
          set -e
          cd apps/mobile
          node -v && npm -v
          # القفل مولَّد بـnpm 11 (Node 24)؛ npm 10 يعدّه ناقصاً. لو رفض npm ci نثبّت بغير صرامة.
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: توليد مشروع iOS (expo prebuild) مع Pods
        script: |
          set -e
          cd apps/mobile
          # إشعارات iOS بمفتاح واحد: IOS_PUSH_READY=true في مجموعة adrenaline-ios بعد تفعيل Push للمعرّف في
          # Apple Developer وتجديد ملف التعريف ورفع مفتاح APNs إلى expo.dev. بدونه يُخفى زر الإشعارات على iOS
          # (src/pushEnabled.ts) وتُزال الصلاحية أدناه — زر لا يعمل سبب رفض في المراجعة.
          if [ "$IOS_PUSH_READY" = "true" ]; then
            node -e "const f='app.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.expo.extra.iosPushEnabled=true;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          fi
          echo "iosPushEnabled: $(node -p "require('./app.json').expo.extra.iosPushEnabled")"
          npx expo prebuild --platform ios --clean
          ls ios/*.xcworkspace
          # مراحل بناء React Native داخل Xcode (codegen/bundle) تشغّل node؛ على السحابة node عبر nvm
          # لا يُرى من صدفة Xcode غير التفاعلية، فنثبّت مساره صراحةً.
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local
          cat ios/.xcode.env.local
          # حزمة expo-notifications تضيف صلاحية Push (aps-environment) تلقائياً، وملف التوقيع بلا Push
          # يُفشل الأرشفة؛ فما لم يكن IOS_PUSH_READY=true نزيل الصلاحية من المشروع المولَّد.
          if [ "$IOS_PUSH_READY" != "true" ]; then
            for ENT in ios/Adrenaline/Adrenaline.entitlements; do
              if [ -f "$ENT" ]; then plutil -remove aps-environment "$ENT" || true; echo "entitlements:"; plutil -p "$ENT"; fi
            done
          fi
      - name: رقم البناء التالي من App Store Connect
        script: |
          set -e
          test -n "$APP_STORE_APPLE_ID" || { echo "APP_STORE_APPLE_ID غير مضبوط في مجموعة adrenaline-ios"; exit 1; }
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((LATEST + 1))
          echo "build number: $NEXT"
          cd apps/mobile/ios && agvtool new-version -all "$NEXT"
      - name: ملفات التوقيع
        script: |
          cd apps/mobile/ios && xcode-project use-profiles
      - name: بناء IPA
        script: |
          set -o pipefail
          ARCHIVE_FLAGS="-destination generic/platform=iOS"
          if ! xcode-project build-ipa --workspace apps/mobile/ios/Adrenaline.xcworkspace --scheme Adrenaline --archive-flags="$ARCHIVE_FLAGS"; then
            echo "════════ أخطاء Xcode (من السجل الكامل) ════════"
            grep -h -n -E "error:|error " /tmp/xcodebuild_logs/*.log | grep -v "warning" | head -60 || true
            echo "════════ آخر 80 سطراً من السجل ════════"
            tail -n 80 /tmp/xcodebuild_logs/*.log || true
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
